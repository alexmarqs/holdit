# The local database, for `pnpm dev` and for the suites that talk to Postgres.
#
# There is no second backend any more: the app reads its wall from Postgres or
# it refuses to start. `pnpm db:local` is the first step of a checkout. On a
# fresh volume, follow with `pnpm db:migrate` and `pnpm db:seed`. After that
# the named volume keeps the wall across container restarts.

# Compose names the project after the directory holding this file, which is
# `scripts/` now — pinned so the containers keep the name they had when this
# file sat at the root (`holdit.lol` with the dot stripped).
name: holditlol

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: holdit
      POSTGRES_PASSWORD: holdit
      POSTGRES_DB: holdit
    ports:
      # Not 5432: a machine with its own Postgres should not have to stop it.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate `holdit_test` database. Runs only when the volume is
      # empty (first start, or after `docker compose down -v`).
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
      # The founding wall. Not an initdb script: the tables only exist once
      # `pnpm db:migrate` has run, so `pnpm db:seed` applies this afterwards.
      - ./seed.sql:/seed/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdit -d holdit"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
